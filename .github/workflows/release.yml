# Packages the theme and publishes it when a version tag is pushed.
#
# WordPress installs a theme from a zip whose single top-level folder is the theme's
# directory name, so the archive has to be neodark/... rather than the bare repo
# contents. Everything below builds it that way and nothing else.
#
# To cut a release: bump `Version:` in style.css, add the entry to readme.txt, commit,
# then create the tag (for example v1.1.9) on GitHub. The first step refuses to publish
# if the tag and the style.css header disagree, so a mislabelled theme cannot ship - a
# theme whose header says one version while the release says another is the one thing
# that makes an update look broken to every site running it.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.1.9'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Work out the version, and refuse to ship a mislabelled one
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VER="${TAG#v}"
          SRC_VER="$(grep -oP '^Version:\s*\K[0-9][0-9.]*' style.css | head -1)"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VER"  >> "$GITHUB_OUTPUT"
          if [ "$TAG_VER" != "$SRC_VER" ]; then
            echo "The tag says $TAG_VER but style.css says $SRC_VER."
            echo "WordPress reads the version from style.css, so a site would be told it"
            echo "is up to date while running the older files. Fix the header and re-tag."
            exit 1
          fi
          echo "Packaging NeoDark $TAG_VER"

      - name: Check readme.txt has an entry for this version
        run: |
          set -euo pipefail
          grep -q "^= ${{ steps.ver.outputs.version }} =" readme.txt || {
            echo "readme.txt has no changelog entry for ${{ steps.ver.outputs.version }}."
            echo "WordPress.org shows that changelog to every site with the theme installed;"
            echo "shipping without it means nobody can see what changed."
            exit 1
          }

      - name: Build the theme archive
        run: |
          set -euo pipefail
          mkdir -p build/neodark
          # Everything except the repository's own plumbing. The theme directory has to be
          # what a site would have on disk - no .git, no workflows, no CI leftovers.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' \
                   --exclude '.gitattributes' ./ build/neodark/
          cd build
          zip -X -r ../neodark.zip neodark
          cd ..
          unzip -l neodark.zip | head -20
          # A theme zip with the wrong top-level folder installs under the wrong name and
          # silently becomes a second, separate theme.
          unzip -l neodark.zip | grep -q " neodark/style.css$" \
            || { echo "FAIL: style.css is not at neodark/style.css inside the archive"; exit 1; }

      - name: Checksum
        run: sha256sum neodark.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NeoDark ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            neodark.zip
            SHA256SUMS.txt
